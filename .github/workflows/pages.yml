# Deploy marketing site to GitHub Pages at https://samuelfabel.github.io/emulator-studio/
#
# Pages URL = /{repo-name}/ — must run from the emulator-studio repo (not emulator-studio-site).
# Site source lives in samuelfabel/emulator-studio-site; this workflow checks it out and builds.

name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: samuelfabel/emulator-studio-site
          ref: main
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          VITE_BASE_PATH: /emulator-studio/
          VITE_GITHUB_REPO_URL: https://github.com/samuelfabel/emulator-studio
          VITE_SITE_URL: https://samuelfabel.github.io/emulator-studio/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
