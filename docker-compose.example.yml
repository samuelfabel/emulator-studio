# Example: Emulator Studio from Docker Hub + Cloud Storage emulator.
#
# The published Studio image runs the API and web dashboard only.
# It does NOT include fake-gcs-server or gcloud Pub/Sub.
# Run those emulators as separate services (recommended).
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   # Edit image name to match your Docker Hub repository
#   docker compose up -d

services:
  studio:
    image: emulator-studio:latest # replace with your Docker Hub image
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      GOOGLE_CLOUD_PROJECT: local-dev
      # Pub/Sub — point at a host or sidecar running gcloud emulator (optional)
      # PUBSUB_EMULATOR_HOST: host.docker.internal:8085
      # Cloud Storage — use the fake-gcs service name on the compose network
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - fake-gcs

  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command:
      - -scheme
      - http
      - -port
      - '4443'
      - -backend
      - memory
      - -external-url
      - http://localhost:4443
      - -public-host
      - localhost:4443
    ports:
      - '4443:4443'
